services:
  - type: web
    name: discord-amigos
    env: node
    plan: free
    region: ohio
    buildCommand: npm install && npm install --prefix client && npm run build --prefix client
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Cole a string de conexão do seu banco gratuito do Neon (https://neon.tech)
